name: Quality Gate (Reusable)

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      py_mutation_min:
        description: Minimum Python mutation score (%)
        required: false
        type: string
        default: '90'
      py_dep_health_fail:
        description: Fail Python job on any vulnerability (pip-audit --strict)
        required: false
        type: string
        default: 'true'
      java_mutation_min:
        description: Minimum Java mutation score (%) for PIT
        required: false
        type: string
        default: '90'
      java_cvss_threshold:
        description: OWASP Dependency-Check fail threshold (CVSS)
        required: false
        type: string
        default: '0.1'
      node_dep_fail_level:
        description: Optional npm audit fail-on severity (low|moderate|high|critical). Empty disables fail.
        required: false
        type: string
        default: ''
      upload_results:
        description: Enable uploading combined metrics to an external endpoint
        required: false
        type: string
        default: 'false'
      upload_url:
        description: Endpoint URL to POST combined metrics JSON (when upload_results is true)
        required: false
        type: string
        default: ''
      telemetry_enabled:
        description: Send anonymous usage stats (repo count, ecosystem, avg mutation score) to help improve Quality Gate++
        required: false
        type: string
        default: 'false'
    secrets:
      upload_token:
        description: Bearer token used to authorize results upload
        required: false

jobs:
  node:
    name: Node Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/node-quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            poc/node-quality-gate/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('poc/node-quality-gate/package-lock.json', 'poc/node-quality-gate/npm-shrinkwrap.json', 'poc/node-quality-gate/pnpm-lock.yaml', 'poc/node-quality-gate/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run Quality Gate
        run: npm run quality:ci

      - name: Dependency health (npm audit)
        run: |
          npm audit --json > npm-audit.json || true
          # Optional gating by severity level via input
          if [ -n "${{ inputs.node_dep_fail_level }}" ]; then
            node -e "
            const fs=require('fs');
            const sevOrder={low:1,moderate:2,high:3,critical:4};
            const want='${{ inputs.node_dep_fail_level }}'.toLowerCase();
            const data=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
            const meta=(data.metadata&&data.metadata.vulnerabilities)||data.vulnerabilities||{};
            const counts={low:0,moderate:0,high:0,critical:0};
            for(const k of Object.keys(counts)) counts[k]=Number(meta[k]||0);
            const shouldFail=Object.entries(counts).some(([k,v])=>sevOrder[k]>=sevOrder[want] && v>0);
            if(shouldFail){
              console.error(`npm audit found ${JSON.stringify(counts)} (fail level ${want})`);
              process.exit(2);
            } else {
              console.log('npm audit within allowed thresholds');
            }
            "
          fi

      - name: Collect Node metrics (Stryker + Lighthouse)
        run: |
          node -e "
          const fs=require('fs'), path=require('path');
          function readJson(p){ try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } }
          const out={ ecosystem:'node', mutation:{ score:null }, perf:{ score:null }, dependencies:{critical:0,high:0,moderate:0,low:0,max_cvss:0} };
          // Stryker JSON (if available)
          const mut = readJson('reports/mutation/mutation.json') || readJson('reports/mutation/mutations.json') || readJson('reports/mutation/mutation-report.json');
          if (mut) {
            const ms = (mut.mutationScore ?? (mut.systemUnderTestMetrics && mut.systemUnderTestMetrics.metrics && mut.systemUnderTestMetrics.metrics.mutationScore) ?? (mut.metrics && mut.metrics.mutationScore) ?? null);
            if (ms !== null && ms !== undefined) {
              out.mutation.score = Math.round(Number(ms) * 100) / 100;
            }
          }
          // Lighthouse CI (.lighthouseci/*.json)
          const dir = '.lighthouseci';
          if (fs.existsSync(dir)) {
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            let best = null, bestScore = null;
            for (const f of files) {
              const j = readJson(path.join(dir, f));
              const s = j && j.categories && j.categories.performance && j.categories.performance.score;
              if (typeof s === 'number') {
                if (bestScore === null || s > bestScore) { bestScore = s; best = j; }
              }
            }
            if (bestScore !== null) {
              out.perf.score = Math.round(bestScore * 100) / 100;
            }
          }
          // npm audit JSON (severity counts)
          const audit = readJson('npm-audit.json');
          if (audit) {
            const meta=(audit.metadata&&audit.metadata.vulnerabilities)||audit.vulnerabilities||{};
            out.dependencies.low = Number(meta.low||0);
            out.dependencies.moderate = Number(meta.moderate||0);
            out.dependencies.high = Number(meta.high||0);
            out.dependencies.critical = Number(meta.critical||0);
          }
          fs.writeFileSync('node_metrics.json', JSON.stringify(out));
          console.log(JSON.stringify(out, null, 2));
          "

      - name: Upload Node metrics
        uses: actions/upload-artifact@v4
        with:
          name: node-metrics
          path: poc/node-quality-gate/node_metrics.json

  python:
    name: Python Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/python-quality-gate
    env:
      PY_MUTATION_MIN: ${{ inputs.py_mutation_min }}
      PY_DEP_HEALTH_FAIL: ${{ inputs.py_dep_health_fail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('poc/python-quality-gate/requirements.txt', 'poc/python-quality-gate/pyproject.toml', 'poc/python-quality-gate/poetry.lock', 'poc/python-quality-gate/requirements-*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e .; fi
          pip install pytest mutmut

      - name: Dependency health (pip-audit)
        if: env.PY_DEP_HEALTH_FAIL == 'true'
        run: |
          python -m pip install --upgrade pip-audit
          # --strict fails on any known vulnerability
          pip-audit --strict

      - name: Export dependency audit (JSON)
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -f json -o audit.json || true

      - name: Run tests
        run: pytest -q

      - name: Run mutation tests (mutmut)
        run: mutmut run --use-coverage || true
      - name: Collect Python metrics
        run: |
          python - <<'PY'
          import json, os, sqlite3, sys
          # ELI5: We count how many fake bugs (mutations) our tests catch
          # and summarize dependency risks, then save it as a simple JSON.
          out = {
            "ecosystem": "python",
            "mutation": {"score": None, "killed": 0, "survived": 0, "timeout": 0},
            "dependencies": {"critical": 0, "high": 0, "moderate": 0, "low": 0, "max_cvss": 0.0}
          }
          # mutmut cache
          try:
            con = sqlite3.connect('.mutmut-cache')
            cur = con.cursor()
            counts = {s: 0 for s in ('killed','survived','timeout')}
            for status, cnt in cur.execute("SELECT status, COUNT(*) FROM results GROUP BY status"):
              if status in counts:
                counts[status] = cnt
            killed, survived, timeout = counts['killed'], counts['survived'], counts['timeout']
            considered = killed + survived + timeout
            score = 100.0 if considered == 0 else (killed / considered) * 100.0
            out["mutation"]= {"score": round(score,2), "killed": killed, "survived": survived, "timeout": timeout}
          except Exception:
            pass
          finally:
            try:
              con.close()
            except Exception:
              pass
          # pip-audit json
          try:
            with open('audit.json','r',encoding='utf-8') as f:
              data = json.load(f)
            max_cvss = 0.0
            sev = {"critical":0,"high":0,"moderate":0,"low":0}
            for item in data:
              vulns = item.get('vulns') or []
              for v in vulns:
                cvss = v.get('score','0')
                try:
                  cvss = float(cvss)
                except Exception:
                  cvss = 0.0
                max_cvss = max(max_cvss, cvss)
                s = (v.get('severity') or '').lower()
                if s in sev:
                  sev[s]+=1
            out["dependencies"]= {**sev, "max_cvss": max_cvss}
          except Exception:
            pass
          with open('python_metrics.json','w',encoding='utf-8') as f:
            json.dump(out,f)
          print(json.dumps(out,indent=2))
          PY

      - name: Upload Python metrics
        uses: actions/upload-artifact@v4
        with:
          name: python-metrics
          path: poc/python-quality-gate/python_metrics.json

      - name: Enforce mutation threshold (mutmut)
        run: |
          python - <<'PY'
          import os, sqlite3, sys
          # ELI5: We open mutmut's hidden database to count how many mutations were killed
          # and calculate a score. If the score is below the required number, we fail.
          threshold = float(os.environ.get('PY_MUTATION_MIN', '90'))
          db_path = '.mutmut-cache'
          try:
            con = sqlite3.connect(db_path)
          except Exception as e:
            print(f"Could not open mutmut cache '{db_path}': {e}")
            sys.exit(1)
          cur = con.cursor()
          # Status values commonly used by mutmut
          counts = {s: 0 for s in ('killed','survived','timeout','suspicious','incompetent','skipped')}
          try:
            for status, cnt in cur.execute("SELECT status, COUNT(*) FROM results GROUP BY status"):
              counts[status] = cnt
          except Exception as e:
            print(f"Failed reading results from mutmut cache: {e}")
            sys.exit(1)
          finally:
            con.close()
          killed = counts['killed']
          survived = counts['survived']
          timeout = counts['timeout']
          considered = killed + survived + timeout
          score = 100.0 if considered == 0 else (killed / considered) * 100.0
          print(f"Mutation score: {score:.2f}% (killed={killed}, survived={survived}, timeout={timeout})")
          if score + 1e-9 < threshold:
            print(f"FAIL: mutation score {score:.2f}% is below threshold {threshold:.2f}%")
            sys.exit(2)
          print("PASS: mutation score meets threshold")
          PY

  java:
    name: Java Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/java-quality-gate
    env:
      JAVA_MUTATION_MIN: ${{ inputs.java_mutation_min }}
      JAVA_DEP_HEALTH_FAIL_CVSS: ${{ inputs.java_cvss_threshold }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('poc/java-quality-gate/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Set PIT mutation threshold in pom.xml
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          pom = 'pom.xml'
          threshold = os.environ.get('JAVA_MUTATION_MIN','90')
          try:
            tree = ET.parse(pom)
            root = tree.getroot()
            # Find mutationThreshold element (namespace-agnostic)
            found = False
            for el in root.iter():
              if el.tag.endswith('mutationThreshold'):
                el.text = str(int(float(threshold)))
                found = True
                break
            if not found:
              for plugin in root.iter():
                if plugin.tag.endswith('plugin'):
                  arts = [c for c in plugin if c.tag.endswith('artifactId') and (c.text or '').strip() == 'pitest-maven']
                  if arts:
                    conf = None
                    for c in plugin:
                      if c.tag.endswith('configuration'):
                        conf = c
                        break
                    if conf is None:
                      conf = ET.SubElement(plugin, 'configuration')
                    mt = ET.SubElement(conf, 'mutationThreshold')
                    mt.text = str(int(float(threshold)))
                    found = True
                    break
            tree.write(pom, encoding='utf-8', xml_declaration=True)
            print(f"Set PIT mutationThreshold to {threshold}")
          except Exception as e:
            print(f"Failed to set mutationThreshold: {e}")
            sys.exit(1)
          PY

      - name: Dependency health (OWASP Dependency-Check)
        run: |
          mvn -q org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=${{ env.JAVA_DEP_HEALTH_FAIL_CVSS }} -Dformat=JSON -DoutputDirectory=target -DprettyPrint=true

      - name: Run tests
        run: mvn -q -DskipTests=false test

      - name: Run PIT mutation coverage
        run: mvn -q org.pitest:pitest-maven:mutationCoverage

      - name: Collect Java metrics
        run: |
          python - <<'PY'
          import json, glob, xml.etree.ElementTree as ET
          # ELI5: Same idea for Java: measure how many fake bugs tests catch
          # and how risky our dependencies are.
          out = {
            "ecosystem": "java",
            "mutation": {"score": None, "detected": 0, "total": 0},
            "dependencies": {"critical": 0, "high": 0, "moderate": 0, "low": 0, "max_cvss": 0.0}
          }
          # PIT mutations
          try:
            files = glob.glob('target/pit-reports/**/mutations.xml', recursive=True)
            detected = total = 0
            for fp in files:
              tree = ET.parse(fp)
              root = tree.getroot()
              for m in root.iter():
                if m.tag.endswith('mutation'):
                  total += 1
                  if m.attrib.get('detected','false').lower() == 'true':
                    detected += 1
            score = 100.0 if total == 0 else (detected/total)*100.0
            out["mutation"] = {"score": round(score,2), "detected": detected, "total": total}
          except Exception:
            pass
          # OWASP Dependency-Check JSON
          try:
            # default output path for plugin JSON
            with open('target/dependency-check-report.json','r',encoding='utf-8') as f:
              data = json.load(f)
            sev = {"critical":0,"high":0,"moderate":0,"low":0}
            max_cvss = 0.0
            for dep in (data.get('dependencies') or []):
              for v in (dep.get('vulnerabilities') or []):
                s = (v.get('severity') or '').lower()
                if s in sev:
                  sev[s]+=1
                try:
                  max_cvss = max(max_cvss, float(v.get('cvssScore', 0.0)))
                except Exception:
                  pass
            out["dependencies"]= {**sev, "max_cvss": max_cvss}
          except Exception:
            pass
          with open('java_metrics.json','w',encoding='utf-8') as f:
            json.dump(out,f)
          print(json.dumps(out,indent=2))
          PY

      - name: Upload Java metrics
        uses: actions/upload-artifact@v4
        with:
          name: java-metrics
          path: poc/java-quality-gate/java_metrics.json

  summary:
    name: PR Quality Summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [python, java]
    steps:
      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          pattern: "*-metrics"
          merge-multiple: true
      - name: Verify downloaded metrics
        run: ls -la
      - name: Build combined metrics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readJson(p) { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } }
            const no = readJson('node_metrics.json');
            const py = readJson('python_metrics.json');
            const ja = readJson('java_metrics.json');
            const {context} = require('@actions/github');
            const payload = {
              repository: context.repo.owner + '/' + context.repo.repo,
              pr_number: context.issue.number,
              commit_sha: context.payload.pull_request?.head?.sha,
              run_id: context.runId,
              node: no,
              python: py,
              java: ja,
              generated_at: new Date().toISOString()
            };
            fs.writeFileSync('combined_metrics.json', JSON.stringify(payload));
            core.info('Wrote combined_metrics.json');
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readJson(p) { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } }
            const no = readJson('node_metrics.json');
            const py = readJson('python_metrics.json');
            const ja = readJson('java_metrics.json');
            function row(label, obj) {
              if (!obj) return `| ${label} | – | – | – | – |`;
              const m = obj.mutation||{};
              const d = obj.dependencies||{};
              const perf = obj.perf && obj.perf.score != null ? ` | perf ${obj.perf.score}` : '';
              return `| ${label} | ${m.score ?? '–'}% | C:${d.critical||0} H:${d.high||0} M:${d.moderate||0} L:${d.low||0} | max CVSS ${d.max_cvss||0}${perf} |`;
            }
            const body = [
              '## Quality Gate Summary',
              '',
              '| Ecosystem | Mutation Score | Vulns (C/H/M/L) | Notes |',
              '|---|---:|---:|---|',
              row('Node', no),
              row('Python', py),
              row('Java', ja),
              '',
              '_ELI5: Higher mutation score = stronger tests. Any high CVSS means risky dependencies._'
            ].join('\n');
            const {context, github} = require('@actions/github');
            const issue = context.issue;
            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body
            });
      - name: Upload combined metrics to dashboard
        if: ${{ inputs.upload_results == 'true' && inputs.upload_url != '' }}
        run: |
          curl -sSf -X POST "${{ inputs.upload_url }}" \
            -H "Authorization: Bearer ${{ secrets.upload_token }}" \
            -H "Content-Type: application/json" \
            --data-binary @combined_metrics.json

      - name: Send anonymous telemetry (opt-in)
        if: ${{ inputs.telemetry_enabled == 'true' }}
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');
          const metrics = JSON.parse(fs.readFileSync('combined_metrics.json', 'utf8'));
          const telemetry = {
            version: 'v0.3.1',
            timestamp: new Date().toISOString(),
            ecosystems: [
              metrics.node ? 'node' : null,
              metrics.python ? 'python' : null,
              metrics.java ? 'java' : null
            ].filter(Boolean),
            mutation_scores: [
              metrics.node?.mutation?.score,
              metrics.python?.mutation?.score,
              metrics.java?.mutation?.score
            ].filter(n => n != null),
            has_vulns: [metrics.node, metrics.python, metrics.java].some(e =>
              e && e.dependencies && (e.dependencies.critical > 0 || e.dependencies.high > 0)
            )
          };
          const data = JSON.stringify(telemetry);
          const req = https.request({
            hostname: 'telemetry.quality-gate.dev',
            port: 443,
            path: '/ping',
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Content-Length': data.length }
          }, () => {});
          req.on('error', () => {}); // Silent fail
          req.write(data);
          req.end();
          " || true
