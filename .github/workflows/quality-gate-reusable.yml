name: Quality Gate (Reusable)

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      py_mutation_min:
        description: Minimum Python mutation score (%)
        required: false
        type: string
        default: '90'
      py_dep_health_fail:
        description: Fail Python job on any vulnerability (pip-audit --strict)
        required: false
        type: string
        default: 'true'
      java_mutation_min:
        description: Minimum Java mutation score (%) for PIT
        required: false
        type: string
        default: '90'
      java_cvss_threshold:
        description: OWASP Dependency-Check fail threshold (CVSS)
        required: false
        type: string
        default: '0.1'

jobs:
  node:
    name: Node Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/node-quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            poc/node-quality-gate/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('poc/node-quality-gate/package-lock.json', 'poc/node-quality-gate/npm-shrinkwrap.json', 'poc/node-quality-gate/pnpm-lock.yaml', 'poc/node-quality-gate/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run Quality Gate
        run: npm run quality:ci

  python:
    name: Python Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/python-quality-gate
    env:
      PY_MUTATION_MIN: ${{ inputs.py_mutation_min }}
      PY_DEP_HEALTH_FAIL: ${{ inputs.py_dep_health_fail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('poc/python-quality-gate/requirements.txt', 'poc/python-quality-gate/pyproject.toml', 'poc/python-quality-gate/poetry.lock', 'poc/python-quality-gate/requirements-*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e .; fi
          pip install pytest mutmut

      - name: Dependency health (pip-audit)
        if: env.PY_DEP_HEALTH_FAIL == 'true'
        run: |
          python -m pip install --upgrade pip-audit
          # --strict fails on any known vulnerability
          pip-audit --strict

      - name: Export dependency audit (JSON)
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -f json -o audit.json || true

      - name: Run tests
        run: pytest -q

      - name: Run mutation tests (mutmut)
        run: mutmut run --use-coverage || true
      - name: Collect Python metrics
        run: |
          python - <<'PY'
          import json, os, sqlite3, sys
          # ELI5: We count how many fake bugs (mutations) our tests catch
          # and summarize dependency risks, then save it as a simple JSON.
          out = {
            "ecosystem": "python",
            "mutation": {"score": None, "killed": 0, "survived": 0, "timeout": 0},
            "dependencies": {"critical": 0, "high": 0, "moderate": 0, "low": 0, "max_cvss": 0.0}
          }
          # mutmut cache
          try:
            con = sqlite3.connect('.mutmut-cache')
            cur = con.cursor()
            counts = {s: 0 for s in ('killed','survived','timeout')}
            for status, cnt in cur.execute("SELECT status, COUNT(*) FROM results GROUP BY status"):
              if status in counts:
                counts[status] = cnt
            killed, survived, timeout = counts['killed'], counts['survived'], counts['timeout']
            considered = killed + survived + timeout
            score = 100.0 if considered == 0 else (killed / considered) * 100.0
            out["mutation"]= {"score": round(score,2), "killed": killed, "survived": survived, "timeout": timeout}
          except Exception:
            pass
          finally:
            try:
              con.close()
            except Exception:
              pass
          # pip-audit json
          try:
            with open('audit.json','r',encoding='utf-8') as f:
              data = json.load(f)
            max_cvss = 0.0
            sev = {"critical":0,"high":0,"moderate":0,"low":0}
            for item in data:
              vulns = item.get('vulns') or []
              for v in vulns:
                cvss = v.get('score','0')
                try:
                  cvss = float(cvss)
                except Exception:
                  cvss = 0.0
                max_cvss = max(max_cvss, cvss)
                s = (v.get('severity') or '').lower()
                if s in sev:
                  sev[s]+=1
            out["dependencies"]= {**sev, "max_cvss": max_cvss}
          except Exception:
            pass
          with open('python_metrics.json','w',encoding='utf-8') as f:
            json.dump(out,f)
          print(json.dumps(out,indent=2))
          PY

      - name: Upload Python metrics
        uses: actions/upload-artifact@v4
        with:
          name: python-metrics
          path: poc/python-quality-gate/python_metrics.json

      - name: Enforce mutation threshold (mutmut)
        run: |
          python - <<'PY'
          import os, sqlite3, sys
          # ELI5: We open mutmut's hidden database to count how many mutations were killed
          # and calculate a score. If the score is below the required number, we fail.
          threshold = float(os.environ.get('PY_MUTATION_MIN', '90'))
          db_path = '.mutmut-cache'
          try:
            con = sqlite3.connect(db_path)
          except Exception as e:
            print(f"Could not open mutmut cache '{db_path}': {e}")
            sys.exit(1)
          cur = con.cursor()
          # Status values commonly used by mutmut
          counts = {s: 0 for s in ('killed','survived','timeout','suspicious','incompetent','skipped')}
          try:
            for status, cnt in cur.execute("SELECT status, COUNT(*) FROM results GROUP BY status"):
              counts[status] = cnt
          except Exception as e:
            print(f"Failed reading results from mutmut cache: {e}")
            sys.exit(1)
          finally:
            con.close()
          killed = counts['killed']
          survived = counts['survived']
          timeout = counts['timeout']
          considered = killed + survived + timeout
          score = 100.0 if considered == 0 else (killed / considered) * 100.0
          print(f"Mutation score: {score:.2f}% (killed={killed}, survived={survived}, timeout={timeout})")
          if score + 1e-9 < threshold:
            print(f"FAIL: mutation score {score:.2f}% is below threshold {threshold:.2f}%")
            sys.exit(2)
          print("PASS: mutation score meets threshold")
          PY

  java:
    name: Java Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/java-quality-gate
    env:
      JAVA_MUTATION_MIN: ${{ inputs.java_mutation_min }}
      JAVA_DEP_HEALTH_FAIL_CVSS: ${{ inputs.java_cvss_threshold }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('poc/java-quality-gate/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Set PIT mutation threshold in pom.xml
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          pom = 'pom.xml'
          threshold = os.environ.get('JAVA_MUTATION_MIN','90')
          try:
            tree = ET.parse(pom)
            root = tree.getroot()
            # Find mutationThreshold element (namespace-agnostic)
            found = False
            for el in root.iter():
              if el.tag.endswith('mutationThreshold'):
                el.text = str(int(float(threshold)))
                found = True
                break
            if not found:
              for plugin in root.iter():
                if plugin.tag.endswith('plugin'):
                  arts = [c for c in plugin if c.tag.endswith('artifactId') and (c.text or '').strip() == 'pitest-maven']
                  if arts:
                    conf = None
                    for c in plugin:
                      if c.tag.endswith('configuration'):
                        conf = c
                        break
                    if conf is None:
                      conf = ET.SubElement(plugin, 'configuration')
                    mt = ET.SubElement(conf, 'mutationThreshold')
                    mt.text = str(int(float(threshold)))
                    found = True
                    break
            tree.write(pom, encoding='utf-8', xml_declaration=True)
            print(f"Set PIT mutationThreshold to {threshold}")
          except Exception as e:
            print(f"Failed to set mutationThreshold: {e}")
            sys.exit(1)
          PY

      - name: Dependency health (OWASP Dependency-Check)
        run: |
          mvn -q org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=${{ env.JAVA_DEP_HEALTH_FAIL_CVSS }} -Dformat=JSON -DoutputDirectory=target -DprettyPrint=true

      - name: Run tests
        run: mvn -q -DskipTests=false test

      - name: Run PIT mutation coverage
        run: mvn -q org.pitest:pitest-maven:mutationCoverage

      - name: Collect Java metrics
        run: |
          python - <<'PY'
          import json, glob, xml.etree.ElementTree as ET
          # ELI5: Same idea for Java: measure how many fake bugs tests catch
          # and how risky our dependencies are.
          out = {
            "ecosystem": "java",
            "mutation": {"score": None, "detected": 0, "total": 0},
            "dependencies": {"critical": 0, "high": 0, "moderate": 0, "low": 0, "max_cvss": 0.0}
          }
          # PIT mutations
          try:
            files = glob.glob('target/pit-reports/**/mutations.xml', recursive=True)
            detected = total = 0
            for fp in files:
              tree = ET.parse(fp)
              root = tree.getroot()
              for m in root.iter():
                if m.tag.endswith('mutation'):
                  total += 1
                  if m.attrib.get('detected','false').lower() == 'true':
                    detected += 1
            score = 100.0 if total == 0 else (detected/total)*100.0
            out["mutation"] = {"score": round(score,2), "detected": detected, "total": total}
          except Exception:
            pass
          # OWASP Dependency-Check JSON
          try:
            # default output path for plugin JSON
            with open('target/dependency-check-report.json','r',encoding='utf-8') as f:
              data = json.load(f)
            sev = {"critical":0,"high":0,"moderate":0,"low":0}
            max_cvss = 0.0
            for dep in (data.get('dependencies') or []):
              for v in (dep.get('vulnerabilities') or []):
                s = (v.get('severity') or '').lower()
                if s in sev:
                  sev[s]+=1
                try:
                  max_cvss = max(max_cvss, float(v.get('cvssScore', 0.0)))
                except Exception:
                  pass
            out["dependencies"]= {**sev, "max_cvss": max_cvss}
          except Exception:
            pass
          with open('java_metrics.json','w',encoding='utf-8') as f:
            json.dump(out,f)
          print(json.dumps(out,indent=2))
          PY

      - name: Upload Java metrics
        uses: actions/upload-artifact@v4
        with:
          name: java-metrics
          path: poc/java-quality-gate/java_metrics.json

  summary:
    name: PR Quality Summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [python, java]
    steps:
      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          pattern: "*-metrics"
          merge-multiple: true
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readJson(p) { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } }
            const py = readJson('python_metrics.json');
            const ja = readJson('java_metrics.json');
            function row(label, obj) {
              if (!obj) return `| ${label} | – | – | – | – |`;
              const m = obj.mutation||{};
              const d = obj.dependencies||{};
              return `| ${label} | ${m.score ?? '–'}% | C:${d.critical||0} H:${d.high||0} M:${d.moderate||0} L:${d.low||0} | max CVSS ${d.max_cvss||0} |`;
            }
            const body = [
              '## Quality Gate Summary',
              '',
              '| Ecosystem | Mutation Score | Vulns (C/H/M/L) | Notes |',
              '|---|---:|---:|---|',
              row('Python', py),
              row('Java', ja),
              '',
              '_ELI5: Higher mutation score = stronger tests. Any high CVSS means risky dependencies._'
            ].join('\n');
            const {context, github} = require('@actions/github');
            const issue = context.issue;
            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body
            });
