name: Quality Gate

on:
  pull_request:

jobs:
  node:
    name: Node Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/node-quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Quality Gate
        run: npm run quality:ci
