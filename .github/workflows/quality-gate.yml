name: Quality Gate

on:
  pull_request:

jobs:
  quality-gate:
    uses: gschull/software-quality-collapse/.github/workflows/quality-gate-reusable.yml@v0.2.0
    with:
      py_mutation_min: '80'
      py_dep_health_fail: 'true'
      java_mutation_min: '80'
      java_cvss_threshold: '5.0'
      upload_results: 'true'
      upload_url: ${{ vars.QG_UPLOAD_URL }}
    secrets:
      upload_token: ${{ secrets.QUALITY_GATE_INGEST_TOKEN }}
