name: Deploy Dashboard

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Fly.io app name (must be globally unique)
        required: true
        type: string
      region:
        description: Fly.io region (e.g., ord, sjc, fra)
        required: false
        default: ord
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Launch app (first run creates app)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd dashboard
          flyctl launch --yes \
            --name "${{ inputs.app_name }}" \
            --region "${{ inputs.region }}" \
            --copy-config \
            --no-deploy || true

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd dashboard
          flyctl deploy --detach
